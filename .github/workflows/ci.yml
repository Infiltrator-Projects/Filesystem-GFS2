# SPDX-License-Identifier: GPL-3.0-or-later
name: GFS2 Common V2 development qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: Libraries
          persist-credentials: false
      - name: Check actual Common ABI and compile both profiles
        run: |
          test "$(git hash-object Libraries/include/infiltratr/filesystem_module_v2.h)" = 90730b68a53ecf6a6e304c789501f29c17c728c7
          make check
      - name: Independent mkfs.gfs2 media; formatter is test oracle only
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfs2-utils
          truncate -s 256M build/independent.img
          mkfs.gfs2 -O -p lock_nolock -j 1 -J 8 -b 4096 build/independent.img
          sha256sum build/independent.img > build/before.sha256
          build/test_gfs2 ./build/GFS2.so build/independent.img
          build/test_gfs2 ./build/freestanding/GFS2.so build/independent.img
          sha256sum -c build/before.sha256
      - name: Sanitizer regression
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check
